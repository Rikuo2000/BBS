<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:sec="https://www.thymeleaf.org/extras/springsecurity6"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title layout:fragment="title">掲示板</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
	<header>
		<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
			<div class="container-fluid">
				<!--ログイン中は投稿一覧へ(/posts)-->
				<a class="navbar-brand" th:href="@{/posts}" sec:authorize="isAuthenticated()">
				    掲示板アプリ
				</a>
				<!--未ログインはトップページへ(/)-->
				<a class="navbar-brand" th:href="@{/}" sec:authorize="isAnonymous()">
				    掲示板アプリ
				</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarSupportedContent">
					<ul class="navbar-nav me-auto mb-2 mb-lg-0">
						<!--ログイン中-->
						<li class="nav-item" sec:authorize="isAuthenticated()">
							<a class="nav-link active" aria-current="page" th:href="@{/posts}">Home</a>
						</li>
						<!--未ログイン-->
						<li class="nav-item" sec:authorize="isAnonymous()">
							<a class="nav-link active" aria-current="page" th:href="@{/}">Home</a>
						</li>
						<li class="nav-item" sec:authorize="isAnonymous()"><!--未ログイン-->
							<a class="nav-link active" aria-current="page" href="/auth/login">Login</a>
						</li>
						<li class="nav-item" sec:authorize="isAnonymous()"><!--未ログイン-->
							<a class="nav-link active" aria-current="page" href="/auth/register">Register</a>
						</li>
						<li class="nav-item" sec:authorize="isAuthenticated()"><!--ログイン中-->
							<form action="/auth/logout" method="post" >
								<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
								<button type="submit" class="nav-link active">Logout</button>
							</form>
						</li>
						<li class="nav-item">
							<a class="nav-link" aria-current="page" href="contact">お問い合わせ</a>
						</li>
					</ul>
				</div>
			</div>
		</nav>
	</header>
	<main class="container mt-4" layout:fragment="content"></main>
	<footer class="bg-dark text-white"><p>&COPY; 2025 掲示板アプリ</p></footer>
	
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>

</body>
</html>
