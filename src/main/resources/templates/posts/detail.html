<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<meta charset="UTF-8">
	<title layout:fragment="title">Post Detail</title>
</head>

<body>
	<main layout:fragment="content">
		<h1 th:text="${post.title}"></h1>
		<p th:text="${post.content}"></p>
		<a th:href="@{/posts}" class="btn btn-secondary">Back To List</a>
		<span th:if="${post.user != null and loggedInUserId == post.user.id}">
			<a th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn btn-primary">Edit</a>
			<form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" style="display: inline;">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
				<button type="submit" class="btn btn-danger">Delete</button>
			</form>
		</span>
		<form th:action="@{/posts/{id}/like(id=${post.id})}" method="post">
			<button type="submit" th:class="${isLiked ? 'btn btn-danger' : 'btn btn-outline-danger'}">
				<i th:class="${isLiked ? 'bi bi-heart-fill' : 'bi bi-heart'}"></i>
			</button>
		</form>
		<p><span th:text="${likeCount}"></span>件のいいね</p>
		<div class="mb-3">
			<div th:each="comment : ${comments}">
				<div class="card mb-3">
					<div class="card-header">
						<strong th:text="${comment.user.username}">Username</strong>
						<small class="text-muted ml-2"
							th:text="${#temporals.format(comment.createdAt, 'yyyy/MM/dd HH:mm:ss')}">Date</small>
					</div>
					<div class="card-body">
						<p th:text="${comment.content}">Comment content</p>
					</div>
					<div class="card-footer">
						<span th:if="${comment.user != null and loggedInUserId == comment.user.id}">
							<form th:action="@{/comments/{id}/delete(id=${comment.id})}" method="post"
								style="display: inline;">
								<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
								<input type="hidden" name="postId" th:value="${post.id}" />
								<button type="submit" class="btn btn-danger btn-sm">Delete</button>
							</form>
						</span>
					</div>
				</div>
			</div>
		</div>
		<h2>Comments</h2>
		<h3>Add a Comment</h3>
		<form th:action="@{/comments/add}" method="post" th:object="${commentForm}">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
			<input type="hidden" name="postId" th:value="${post.id}" />
			<div class="mb-3">
				<textarea name="content" class="form-control" rows="3" placeholder="Write a comment..." required
					th:field="*{content}"></textarea>
				<div th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="text-danger"></div>
			</div>
			<button type="submit" class="btn btn-success">Add Comment</button>
		</form>
	</main>
</body>

</html>
