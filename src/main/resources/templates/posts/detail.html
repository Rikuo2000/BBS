<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<meta charset="UTF-8">
	<title layout:fragment="title" th:text="#{post.detail}">Post Detail</title>
</head>

<body>
	<main layout:fragment="content">
		<h1 th:text="${post.title}"></h1>
		<p th:text="${post.content}"></p>
		<a th:href="@{/posts}" class="btn btn-secondary" th:text="#{detail.to.list}">Back To List</a>
		<span th:if="${post.user != null and loggedInUserId == post.user.id}">
			<a th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn btn-primary" th:text="#{common.edit}">Edit</a>
			<form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" style="display: inline;">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
				<button type="submit" class="btn btn-danger" th:text="#{common.delete}">Delete</button>
			</form>
		</span>
		<button id="like-button" type="submit" th:class="${isLiked ? 'btn btn-danger' : 'btn btn-outline-danger'}"
			th:data-post-id="${post.id}">
			<i id="like-icon" th:class="${isLiked ? 'bi bi-heart-fill' : 'bi bi-heart'}"></i>
		</button>
		<p>
			<span id="like-count" th:text="${likeCount}"></span>
			<span th:text="#{like.count}">件のいいね</span>
		</p>
		<h2 th:text="#{post.Comments}">Comments</h2>
		<div class="mb-3">
			<div th:each="comment : ${comments}">
				<div class="card mb-3">
					<div class="card-header">
						<strong th:text="${comment.user.username}">Username</strong>
						<small class="text-muted ml-2"
							th:text="${#temporals.format(comment.createdAt, 'yyyy/MM/dd HH:mm:ss')}">Date</small>
					</div>
					<div class="card-body">
						<p th:text="${comment.content}">Comment content</p>
					</div>
					<div class="card-footer">
						<span th:if="${comment.user != null and loggedInUserId == comment.user.id}">
							<form th:action="@{/comments/{id}/delete(id=${comment.id})}" method="post"
								style="display: inline;">
								<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
								<input type="hidden" name="postId" th:value="${post.id}" />
								<button type="submit" class="btn btn-danger btn-sm"
									th:text="#{common.delete}">Delete</button>
							</form>
						</span>
					</div>
				</div>
			</div>
		</div>
		<h3 th:text="#{post.comments.add}">Add a Comment</h3>
		<form th:action="@{/comments/add}" method="post" th:object="${commentForm}">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
			<input type="hidden" name="postId" th:value="${post.id}" />
			<div class="mb-3">
				<textarea name="content" class="form-control" rows="3" th:placeholder="#{post.comment.placeholder}" required
					th:field="*{content}"></textarea>
				<div th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="text-danger"></div>
			</div>
			<button type="submit" class="btn btn-success" th:text="#{post.comments.add}">Add Comment</button>
		</form>
		<script>
			document.addEventListener("DOMContentLoaded", function () {
				const likeButton = document.getElementById("like-button");
				const likeIcon = document.getElementById("like-icon");
				const likeCount = document.getElementById("like-count");

				const csrfToken = document.querySelector("meta[name='_csrf']").getAttribute("content");
				const csrfHeader = document.querySelector("meta[name='_csrf_header']").getAttribute("content");

				console.log(csrfToken);
				console.log(csrfHeader);

				likeButton.addEventListener("click", function () {
					const postId = likeButton.getAttribute("data-post-id");
					fetch(`/posts/${postId}/like`, {
						method: "POST",
						headers: {
							"Content-Type": "application/json",

							[csrfHeader]: csrfToken
						},
					})
						.then(response => response.json())
						.then(data => {
							console.log(data);
							if (data.error) {
								alert(data.error);
								return;
							}

							if (data.isLiked) {
								likeButton.classList.remove("btn-outline-danger")
								likeIcon.classList.remove("bi-heart")
								likeButton.classList.add("btn-danger")
								likeIcon.classList.add("bi-heart-fill")
							} else {
								likeButton.classList.remove("btn-danger")
								likeIcon.classList.remove("bi-heart-fill")
								likeButton.classList.add("btn-outline-danger")
								likeIcon.classList.add("bi-heart")
							}

							likeCount.textContent = data.likeCount;
						})
						.catch(error => console.error("Error", error));
				});
			});
		</script>
	</main>
</body>

</html>
