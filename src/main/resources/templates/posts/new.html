<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<meta charset="UTF-8">
	<title layout:fragment="title">New Post</title>
</head>

<body>
	<main layout:fragment="content">
		<h1>New Post</h1>
		<form th:action="@{/posts}" method="post" th:object="${post}">
			<div class="mt-3">
				<label for="title" class="form-label">Title</label>
				<input type="text" id="title" name="title" class="form-control" required th:field="*{title}">
				<div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-danger"></div>
			</div>
			<div class="mt-3">
				<label for="content" class="form-label">Content</label>
				<textarea id="content" name="content" class="form-control" rows="5" required th:field="*{content}"></textarea>
				<div th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="text-denger"></div>
			</div>
			<button type="submit" class="btn btn-success">submit</button>
		</form>
	</main>
</body>

</html>
