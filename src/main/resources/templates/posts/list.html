<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{layout/layout}">
<head>
	<meta charset="UTF-8">
	<title layout:fragment="title">Post List</title>
</head>
<body>
<main layout:fragment="content">
	<h1>Post List</h1>
	<h2>新規投稿</h2>
	<a th:href="@{/posts/new}" class="btn btn-primary mb-3">New Post</a>
	<!--検索・ソート-->
	<form th:action="@{/posts}" method="get" class="mb-3">
		<div class="row">
			<div class="col-md-6">
				<input type="text" name="keyword" class="form-control" placeholder="Search" th:value="${param.keyword}" required>
			</div>
			<div class="col-md-2">
				<select name="matchType" class="form-control">
					<option value="contains" th:selected="${param.matchType?.toString() == 'contains'}">部分一致</option>
					<option value="startswith" th:selected="${param.matchType?.toString() == 'startswith'}">前方一致</option>
					<option value="endswith" th:selected="${param.matchType?.toString() == 'endswith'}">後方一致</option>
				</select>
			</div>
			<div class="col-md-2">
				<select name="sortBy" class="form-control">
					<option value="createdAt" th:selected="${param.sortBy?.toString() == 'createdAt'}">作成日</option>
					<option value="title" th:selected="${param.sortBy?.toString() == 'title'}">タイトル</option>
				</select>
			</div>
			<div class="col-md-2">
				<select name="sortOrder" class="form-control">
					<option value="asc" th:selected="${param.sortOrder?.toString() == 'asc'}">昇順</option>
					<option value="desc" th:selected="${param.sortOrder?.toString() == 'desc'}">降順</option>
				</select>
			</div>
			<div class="col-md-2">
				<button type="submit" class="btn btn-primary">検索</button>
			</div>
		</div>
	</form>
	
	<h2>掲示板一覧</h2>
	<table class="table table-striped">
		<thead>
			<tr>
				<th scope="col" style="width: 30%;">Title</th>
				<th scope="col" style="width: 50%;">Content</th>
				<th scope="col" style="width: 20%;" class="text-end">Actions</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="post : ${posts}">
				<td>
					<a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}"></a>
				</td>
				<td>
					<span th:text="${post.content}"></span>
				</td>
				<td class="text-end">
					<div th:if="${post.user != null and loggedInUserId == post.user.id}">
						<a th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn btn-primary btn-sm">Edit</a>
						<form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" style="display: inline;">
							<button type="submit" class="btn btn-danger btn-sm">Delete</button>
						</form>
					</div>
				</td>
			</tr>
		</tbody>
	</table>
	<nav aria-label="Page navigation">
	  <ul class="pagination justify-content-center">
	    <li th:class="${posts.number == 0} ? 'page-item disabled' : 'page-item'">
	      <a class="page-link" th:href="@{/posts(page = ${posts.number-1}, keyword=${param.keyword}, matchType=${param.matchType}, sortBy=${param.sortBy}, sortOrder=${param.sortOrder})}">Previous</a>
	    </li>

		<li th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, posts.number - 2), T(java.lang.Math).min(posts.totalPages - 1, T(java.lang.Math).max(0, posts.number - 2) + 4))}"class="page-item" th:classappend="${i == posts.number} ? ' active'">
			<a class="page-link" th:href="@{/posts(page=${i}, keyword=${param.keyword}, matchType=${param.matchType}, sortBy=${param.sortBy}, sortOrder=${param.sortOrder})}" th:text="${i + 1}"></a>
		</li>

		<li th:class="${posts.number >= posts.totalPages - 1} ? 'page-item disabled' : 'page-item'">
			<a class="page-link" th:href="@{/posts(page = ${posts.number + 1}, keyword=${param.keyword}, matchType=${param.matchType}, sortBy=${param.sortBy}, sortOrder=${param.sortOrder})}">Next</a>
		</li>
	  </ul>
	</nav>
</main>	
</body>
</html>
