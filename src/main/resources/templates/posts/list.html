<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<meta charset="UTF-8">
	<title layout:fragment="title" th:text="#{post.list.title}">Post List</title>
	<style>
		.ellipsis-cell {
			max-width: 0;
			overflow: hidden;
		}

		.ellipsis-cell a,
		.ellipsis-cell span {
			display: block;
			overflow: hidden;
			white-space: nowrap;
			text-overflow: ellipsis;
		}
	</style>

</head>

<body>
	<main layout:fragment="content">
		<h1 th:text="#{post.list.title}">Post List</h1>
		<a th:href="@{/posts/new}" class="btn btn-primary mb-3" th:text="#{post.new}">New Post</a>
		<!--検索・ソート-->
		<form th:action="@{/posts}" method="get" class="mb-3">
			<div class="row">
				<div class="col-md-6">
					<input type="text" name="keyword" class="form-control" placeholder="Search"
						th:value="${param.keyword}" required>
				</div>
				<div class="col-md-2">
					<select name="matchType" class="form-control">
						<option value="contains" th:selected="${param.matchType?.toString() == 'contains'}"
							th:text="#{search.match.contains}">部分一致</option>
						<option value="startswith" th:selected="${param.matchType?.toString() == 'startswith'}"
							th:text="#{search.match.startswith}">前方一致</option>
						<option value="endswith" th:selected="${param.matchType?.toString() == 'endswith'}"
							th:text="#{search.match.endswith}">後方一致</option>
					</select>
				</div>
				<div class="col-md-2">
					<select name="sortBy" class="form-control">
						<option value="createdAt" th:selected="${param.sortBy?.toString() == 'createdAt'}"
							th:text="#{search.sort.createdAt}">作成日</option>
						<option value="title" th:selected="${param.sortBy?.toString() == 'title'}"
							th:text="#{post.title}">タイトル
						</option>
					</select>
				</div>
				<div class="col-md-2">
					<select name="sortOrder" class="form-control">
						<option value="asc" th:selected="${param.sortOrder?.toString() == 'asc'}"
							th:text="#{search.order.asc}">昇順
						</option>
						<option value="desc" th:selected="${param.sortOrder?.toString() == 'desc'}"
							th:text="#{search.order.desc}">降順
						</option>
					</select>
				</div>
				<div class="col-md-2">
					<button type="submit" class="btn btn-primary" th:text="#{search.button}">検索</button>
				</div>
			</div>
		</form>

		<h2 th:text="#{post.board.list}">掲示板一覧</h2>

		<table class="table table-striped" style="table-layout: fixed;">
			<thead>
				<tr>
					<th scope="col" style="width: 30%;" th:text="#{post.title}">Title</th>
					<th scope="col" style="width: 50%;" th:text="#{post.content}">Content</th>
					<th scope="col" style="width: 20%;" class="text-end" th:text="#{common.actions}">Actions</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="post : ${posts}">
					<td class="ellipsis-cell">
						<a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}"></a>
					</td>
					<td class="ellipsis-cell">
						<span th:text="${post.content}"></span>
					</td>
					<td class="text-end">
						<div th:if="${post.user != null and loggedInUserId == post.user.id}">
							<a th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn btn-primary btn-sm"
								th:text="#{common.edit}">Edit</a>
							<form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post"
								style="display: inline;">
								<button type="submit" class="btn btn-danger btn-sm"
									th:text="#{common.delete}">Delete</button>
							</form>
						</div>
					</td>
				</tr>
			</tbody>
		</table>
		<nav aria-label="Page navigation">
			<ul class="pagination justify-content-center">
				<li th:class="${posts.number == 0} ? 'page-item disabled' : 'page-item'">
					<a class="page-link"
						th:href="@{/posts(page = ${posts.number-1}, keyword=${param.keyword}, matchType=${param.matchType}, sortBy=${param.sortBy}, sortOrder=${param.sortOrder})}"
						th:text="#{paging.previous}">Previous</a>
				</li>

				<li th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, posts.number - 2), T(java.lang.Math).min(posts.totalPages - 1, T(java.lang.Math).max(0, posts.number - 2) + 4))}"
					class="page-item" th:classappend="${i == posts.number} ? ' active'">
					<a class="page-link"
						th:href="@{/posts(page=${i}, keyword=${param.keyword}, matchType=${param.matchType}, sortBy=${param.sortBy}, sortOrder=${param.sortOrder})}"
						th:text="${i + 1}"></a>
				</li>

				<li th:class="${posts.number >= posts.totalPages - 1} ? 'page-item disabled' : 'page-item'">
					<a class="page-link"
						th:href="@{/posts(page = ${posts.number + 1}, keyword=${param.keyword}, matchType=${param.matchType}, sortBy=${param.sortBy}, sortOrder=${param.sortOrder})}"
						th:text="#{paging.next}">Next</a>
				</li>
			</ul>
		</nav>
	</main>
</body>

</html>
