<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<meta charset="UTF-8">
	<title layout:fragment="title" th:text="#{post.edit}">Edit Post</title>
</head>

<body>
	<main layout:fragment="content">
		<h1 th:text="#{post.edit}">Edit Post</h1>
		<form th:action="@{/posts/{id}(id=${postId})}" th:object="${post}" method="post">
			<div class="mt-3">
				<label for="title" class="form-label" th:text="#{post.title}">Title</label>
				<input type="text" id="title" class="form-control" th:field="*{title}">
				<div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
			</div>
			<div class="mt-3">
				<label for="content" class="form-label" th:text="#{post.content}">Content</label>
				<textarea id="content" class="form-control" rows="5" th:field="*{content}"></textarea>
				<div class="text-danger" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
			</div>
			<button type="submit" class="btn btn-success" th:text="#{post.update}">update</button>
			<a th:href="@{/posts/{id}(id=${postId})}" class="btn btn-secondary" th:text="#{post.cancel}">Cancel</a>
		</form>
	</main>
</body>

</html>
