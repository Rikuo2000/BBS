<!DOCTYPE html>
<html layout:decorate="layout/layout">

<head>
	<meta charset="UTF-8">
	<title layout:fragment="title">お問い合わせフォーム</title>
</head>

<body>
	<main layout:fragment="content">
		<h1 class="mb-4">お問い合わせフォーム</h1>
		<form th:action="@{/contact/confirm}" method="post">
			<div class="mb-3">
				<label for="name" class="from-label">お名前</label>
				<input type="name" id="name" name="name" class="form-control" placeholder="例：山田　太郎" required>
			</div>
			<div class="mb-3">
				<label for="email" class="from-label">メールアドレス</label>
				<input type="email" id="email" name="email" class="form-control" placeholder="例：example@gmail.com" required>
			</div>
			<div class="mb-3">
				<label for="message" class="form-label">お問い合わせ内容</label>
				<textarea id="message" name="message" class="form-control" rows="5" placeholder="お問い合わせ内容をご記入ください" required></textarea>
			</div>
			<button type="submit" class="btn btn-primary">確認画面へ進む</button>
		</form>
	</main>
</body>
