<!DOCTYPE html>
<html layout:decorate="layout/layout">

<head>
	<meta charset="UTF-8">
	<title layout:fragment="title" th:text="#{contact.confirm.title}">お問い合わせ確認画面</title>
</head>

<body>
	<main layout:fragment="content">
		<h1 class="mb-4" th:text="#{contact.confirm.title}">お問い合わせ確認画面</h1>
		<form th:action="@{/contact/submit}" method="post">
			<div class="mb-3">
				<label class="form-label" th:text="#{contact.name}">お名前</label>
				<p th:text="${contactData.name}" class="form-control-plaintext"></p>
				<input type="hidden" name="name" th:value="${contactData.name}">
			</div>
			<div class="mb-3">
				<label class="form-label" th:text="#{contact.email}">メールアドレス</label>
				<p th:text="${contactData.email}" class="form-control-plaintext"></p>
				<input type="hidden" name="email" th:value="${contactData.email}">
			</div>
			<div class="mb-3">
				<label class="form-label" th:text="#{contact.message}">お問い合わせ内容</label>
				<p th:text="${contactData.message}" class="form-control-plaintext"></p>
				<input type="hidden" name="message" th:value="${contactData.message}">
			</div>
			<button type="submit" class="btn btn-primary" th:text="#{contact.button.submit}">送信する</button>
			<a href="/contact" class="btn btn-secondary" th:text="#{contact.button.back}">戻る</a>
		</form>
	</main>
</body>
