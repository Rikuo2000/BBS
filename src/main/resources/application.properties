spring.application.name=BBS

# MySQLの設定
spring.datasource.url=jdbc:mysql://localhost:3306/board?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPAの設定
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo


#ログの設定
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


#ホットリロードを有効にする
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

#Thymeleafログを有効化
spring.thymeleaf.cache=false
logging.level.org.thymeleaf=DEBUG

#Flyway設定
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

#メールの設定
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=rikujob1096@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#メールカスタム設定
mail.from=rikujob1096@gmail.com
mail.admin=rikujob1096@gmail.com