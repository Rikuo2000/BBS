spring.application.name=BBS

# MySQLの設定
spring.datasource.url=jdbc:mysql://localhost:3306/board?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=tr6250
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPAの設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#ログの設定
logging.level.org.hibernate.sql=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

#ホットリロードを有効にする
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

#Thymeleafログを有効化
spring.thymeleaf.cache=false
logging.level.org.thymeleaf=DEBUG